<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Altair</title>
    <base href="https://unpkg.com/altair-static@latest/build/dist/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
    <style>.url-box__method-wrapper, .url-box__input-container { display: none !important; }</style>
  </head>

  <body>
    <div class="toolbar">
  <label for="endpoint">Endpoint:</label>
  <select id="endpoint">
  </select>
</div>
    <app-root>
      <style>
        .loading-screen {
          display: none;
        }
      </style>
      <div class="loading-screen styled">
        <div class="loading-screen-inner">
          <div class="loading-screen-logo-container">
            <img src="assets/img/logo_350.svg" alt="Altair" />
          </div>
          <div class="loading-screen-loading-indicator">
            <span class="loading-indicator-dot"></span>
            <span class="loading-indicator-dot"></span>
            <span class="loading-indicator-dot"></span>
          </div>
        </div>
      </div>
    </app-root>
    <script type="module" src="polyfills.js"></script>
    <script type="module" src="main.js"></script>
    <script type="module">
      (function (endpointElm) {
        const endpoints = %%GRAPHQL_ENDPOINT_OPTIONS%%;
        endpoints.forEach((endpoint) => {
          const option = new Option(endpoint.name, endpoint.endpoint);
          endpointElm.append(option);
        });
        endpointElm.addEventListener('change', (event) => {
          AltairGraphQL.init({
            endpointURL: event.target.value,
            initialSettings: {
              'theme.light': true,
            },
          });
        });
        document.addEventListener("DOMContentLoaded", () => {
          AltairGraphQL.init({
            endpointURL: endpoint.value,
            initialSettings: {
              'theme.light': true,
            },
          });
      });
      }(document.querySelector('#endpoint')));
    </script>
  </body>
</html>
